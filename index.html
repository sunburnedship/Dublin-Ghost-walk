<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Shadows of Dublin — Ghost Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --card:#13131d; --border:#2a2a3a;
  --gold:#c9a84c; --goldDim:#8a7233; --goldBg:rgba(201,168,76,.15);
  --text:#e8e4d9; --muted:#8a8677;
  --danger:#e05555; --dangerBg:rgba(224,85,85,.12);
  --success:#4cc96a;
  --warn:#c9944c; --warnBg:rgba(201,148,76,.12);
  --purple:#b090e0; --purpleBg:rgba(100,60,180,.12);
  --Fd:'Playfair Display',Georgia,serif;
  --Fb:'Source Serif 4',Palatino,serif;
  --Fm:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);min-height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:var(--Fb);color:var(--text);line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.985)}
input{font-family:inherit}

.wrap{max-width:520px;margin:0 auto;padding:16px 16px 60px;min-height:100vh}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.centerbox{max-width:390px;width:100%}

.splashbg{background:radial-gradient(ellipse at 50% 25%,#1a1a2a,var(--bg) 65%)}
.donebg{background:radial-gradient(ellipse at 50% 22%,#0e1f0e,var(--bg) 62%);min-height:100vh}

h1.logo{font-family:var(--Fd);font-size:50px;font-weight:900;color:var(--gold);line-height:1.05;margin:6px 0;letter-spacing:-1px}
h1.logo em{font-weight:400;font-size:26px;color:var(--muted)}
.ghosticon{font-size:64px;filter:drop-shadow(0 0 24px rgba(201,168,76,.5))}
.shamrock{color:var(--goldDim);font-size:13px;letter-spacing:12px;margin:14px 0}
.tagline{font-family:var(--Fd);font-size:16px;font-style:italic;margin:6px 0 4px}
.route{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:0 0 26px}
.fine{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}

.btn{display:block;width:100%;border-radius:8px;padding:13px 20px;font-size:15px;font-weight:700;
     font-family:var(--Fd);letter-spacing:.5px;transition:all .15s;border:2px solid var(--gold);
     color:var(--gold);background:transparent}
.btn:hover{background:var(--gold);color:#000}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghostbtn{border-color:var(--border);color:var(--muted);border-width:1px;font-family:var(--Fb);font-weight:400;font-size:14px}
.btn.ghostbtn:hover{background:transparent;color:var(--text);border-color:var(--muted)}
.btn.warnbtn{border-color:rgba(201,148,76,.45);background:var(--warnBg);color:var(--warn);border-width:1px;font-family:var(--Fb);font-weight:400;font-size:14px}
.btn.warnbtn:hover{background:var(--warnBg);color:var(--warn)}
.btn.okbtn{background:var(--success);border-color:var(--success);color:#000}

.backlink{background:none;border:none;color:var(--gold);font-family:var(--Fb);font-size:15px;padding:4px 0 12px;display:block}
.linkbtn{background:none;border:none;padding:0;font-family:var(--Fm);font-size:11px;color:var(--muted);text-decoration:underline}

h2.head{font-family:var(--Fd);font-size:26px;font-weight:700;color:var(--gold);margin:0 0 8px}
.lede{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 24px}
label.lbl{display:block;font-family:var(--Fd);font-size:13px;font-weight:600;margin:20px 0 8px;letter-spacing:.5px}

.teamgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.teambtn{font-family:var(--Fm);font-size:18px;font-weight:700;color:var(--muted);background:var(--card);
         border:1px solid var(--border);border-radius:8px;padding:14px 0;transition:all .15s}
.teambtn.on{color:var(--gold);background:var(--goldBg);border-color:var(--gold)}

input.txt{width:100%;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);
          border-radius:8px;padding:12px 16px;outline:none}
input.txt:focus{border-color:var(--gold)}

.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.hdr .tname{font-family:var(--Fd);font-size:16px;font-weight:700;color:var(--gold);margin:0}
.hdr .tsub{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:2px 0 0}
.hdr .tlab{font-family:var(--Fm);font-size:10px;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:1px}
.hdr .tval{font-family:var(--Fm);font-size:24px;font-weight:700;margin:0}
.hdr .pen{font-family:var(--Fm);font-size:10px;color:var(--warn);margin:0}

.resumed{background:rgba(76,201,106,.1);border:1px solid rgba(76,201,106,.3);border-radius:8px;
         padding:9px 13px;margin-bottom:14px;font-family:var(--Fm);font-size:11px;color:var(--success)}

.bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:22px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--goldDim),var(--gold));transition:width .6s}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.cardrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tag{font-family:var(--Fm);font-size:10px;text-transform:uppercase;letter-spacing:2px;display:block}
.body{font-size:15px;line-height:1.85;margin:0}

.listen{font-family:var(--Fm);font-size:11px;letter-spacing:.5px;border-radius:20px;padding:6px 14px;
        white-space:nowrap;border:1px solid rgba(201,168,76,.4);background:var(--goldBg);color:var(--gold);transition:all .15s}
.listen.playing{border-color:rgba(224,85,85,.45);background:var(--dangerBg);color:var(--danger)}
.listen.loading{border-color:rgba(138,134,119,.35);background:rgba(255,255,255,.04);color:var(--muted);cursor:wait}

.hint{background:var(--warnBg);border:1px solid rgba(201,148,76,.3);border-radius:10px;padding:16px;margin-bottom:12px}
.hint .tag{color:var(--warn);margin-bottom:8px}
.hint p{font-size:14px;margin:0;line-height:1.7}
.reveal{background:rgba(201,148,76,.18);border:1px solid var(--warn);border-radius:10px;padding:16px;margin-bottom:12px;text-align:center}
.reveal .big{font-family:var(--Fd);font-size:18px;font-weight:700;color:var(--warn);margin:0 0 4px}
.reveal .sm{font-family:var(--Fm);font-size:12px;color:var(--muted);margin:0}

.wrongbox{background:var(--dangerBg);border:1px solid rgba(224,85,85,.3);border-radius:8px;padding:10px 14px;
          margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrongbox p{color:var(--danger);font-size:13px;margin:0;line-height:1.5}
.wrongbox span{font-family:var(--Fm);font-size:12px;color:var(--danger);font-weight:700;white-space:nowrap}

.guessrow{display:flex;gap:8px;margin-top:4px}
.guessrow input{flex:1}
.guessrow button{width:auto;padding:12px 22px;font-size:14px;flex-shrink:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;font-style:italic;text-align:center}

.dest{background:linear-gradient(135deg,rgba(201,168,76,.14),rgba(201,168,76,.04));border:1px solid rgba(201,168,76,.35);
      border-radius:14px;padding:22px 20px;margin-bottom:14px;text-align:center}
.dest .emoji{font-size:48px;margin-bottom:8px}
.dest h3{font-family:var(--Fd);font-size:26px;font-weight:700;color:var(--gold);margin:0 0 4px}
.dest .sub{font-family:var(--Fm);font-size:12px;color:var(--muted);margin:0}

.ghostcard{background:var(--purpleBg);border:1px solid rgba(176,144,224,.3);border-radius:12px;padding:20px;margin-bottom:16px}
.ghostcard .tag{color:var(--purple)}

.errbox{background:var(--dangerBg);border:1px solid rgba(224,85,85,.3);border-radius:8px;padding:10px 14px;
        margin-bottom:14px;font-size:12px;color:var(--danger);font-family:var(--Fm);line-height:1.5}
.gpsmsg{color:var(--danger);font-size:13px;margin:10px 0 2px;line-height:1.5}
.gpsdist{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:2px 0 0}
.mini{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:1px}

.finaltime{font-family:var(--Fm);font-size:46px;font-weight:700;margin:0}
.mt{margin-top:24px}
.mb{margin-bottom:10px}

/* ---- finish summary ---- */
.sumwrap{max-width:520px;margin:0 auto;padding:26px 16px 64px;text-align:center}
.srow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);text-align:left}
.srow:last-child{border-bottom:none}
.sn{font-family:var(--Fm);font-size:12px;color:var(--muted);width:20px;flex-shrink:0;padding-top:3px}
.sp{flex:1;min-width:0}
.sp b{display:block;font-family:var(--Fd);font-size:14px;font-weight:600;color:var(--text)}
.sp span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.st{font-family:var(--Fm);font-size:12px;color:var(--gold);flex-shrink:0;padding-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:11px 8px}
.stat b{display:block;font-family:var(--Fm);font-size:20px;color:var(--gold)}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.split{display:flex;justify-content:space-around;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.split div{font-family:var(--Fm);font-size:11px;color:var(--muted)}
.split b{display:block;font-size:15px;color:var(--text);margin-top:3px}
.seclab{font-family:var(--Fm);font-size:10px;text-transform:uppercase;letter-spacing:2px;
        color:var(--muted);text-align:left;margin:26px 0 8px}
</style>
</head>

(function(){

var GPS_RADIUS  = 50;                             // metres allowed for check-in

/* ============================================================
   LOCATIONS  (18 possible stops + fixed start & finish)
   ============================================================ */
var LOCS = {
start:{name:"St. Stephen's Green",emoji:"\u{1F33F}",lat:53.33815,lng:-6.25914,
clue:"One of Dublin's most cherished public spaces has been open to the public since 1664 \u2014 though its history is far from serene. Originally used for public hangings and floggings, it was redesigned in 1880 by a member of Dublin's most famous brewing dynasty. During the 1916 Easter Rising, rebel forces dug trenches here and exchanged fire with British soldiers on the rooftops of a grand hotel overlooking the grounds. Bullet holes can still be found in the surrounding buildings.",
ghost:"On foggy evenings, visitors have reported hearing the phantom crack of a hangman's rope near the northwest corner, where public executions took place for over a century. The most persistent sighting is of a woman in grey who walks the perimeter path after midnight, believed to be the shade of a young woman executed in 1798 for aiding rebel forces. Groundskeepers have reported finding flower beds near the Wolfe Tone memorial disturbed in the mornings, with no footprints leading in or out.",
answers:["st stephens green","stephens green","stephen green","st stephen green","st stephens"],
hint1:"This beautiful 9-hectare park sits right in the heart of Dublin city centre, at the top of one of Dublin's most famous pedestrian shopping streets.",
hint2:"It sits at the top of Grafton Street. During the 1916 Rising, Countess Constance Markievicz commanded rebel forces inside its iron gates."},

loc_a:{name:"St. Ann's Church",subtitle:"Dawson Street",emoji:"\u26EA",lat:53.34095,lng:-6.25730,
clue:"Built in 1720 on one of Dublin's most elegant Georgian streets, this parish church has been a centre of city life for three centuries. It maintains a remarkable tradition: a bread shelf endowed in 1723 still provides food to the poor of the parish to this day. In September 1878, the author of the world's most famous vampire novel walked through its doors, not to research his work, but to get married.",
ghost:"It was in this very church that Bram Stoker married Florence Balcombe in 1878, the same woman Oscar Wilde had once courted. Some say Wilde's jealous spirit has never forgiven the slight. Late-night passersby have heard faint organ music drifting from the locked church, though no organist is present. A verger in the 1960s reported seeing a tall figure in a velvet coat standing in the gallery, watching the empty pews below with profound sadness. When he called out, the figure vanished, leaving only the scent of lilies.",
answers:["st anns","st ann","st anns church","anns church","dawson street church"],
hint1:"This church sits on Dawson Street, running parallel to and east of Grafton Street, between St. Stephen's Green and Trinity College.",
hint2:"It's where Bram Stoker was married. Look for the striking Romanesque facade added in 1868 \u2014 one of the street's most recognisable buildings."},

loc_b:{name:"Powerscourt Townhouse",subtitle:"South William Street",emoji:"\u{1F3DB}\uFE0F",lat:53.34190,lng:-6.26240,
clue:"This magnificent Georgian townhouse was built in 1774 for a Viscount whose family seat is one of Ireland's most famous estates in the Wicklow Mountains. Designed by Robert Mack, its elaborate plasterwork and grand mahogany staircase once hosted lavish aristocratic balls. Converted into a shopping centre in 1981, the building retains its extraordinary Georgian grandeur, tucked away on a street running parallel to Grafton Street.",
ghost:"The ghost of a serving girl has been seen on the grand staircase, always climbing, never arriving. She was a maid who fell to her death from the upper gallery during a ball in the 1790s. Some whisper she was pushed by a jealous rival. Shopkeepers on the upper floors report items rearranging themselves overnight and the sound of rustling fabric in empty corridors. One night watchman refused to return after hearing a woman's voice whispering for help from the empty stairwell at three in the morning.",
answers:["powerscourt","powerscourt townhouse","powerscourt centre","powerscourt center","powerscourt shopping"],
hint1:"This 18th-century townhouse is now a shopping centre on South William Street, between Grafton Street and South Great George's Street.",
hint2:"The family name is associated with a famous waterfall and estate in County Wicklow."},

loc_c:{name:"Dublin Castle",subtitle:"Dame Street",emoji:"\u{1F3F0}",lat:53.34320,lng:-6.26740,
clue:"For over 700 years, this fortress complex stood as the seat of British rule in Ireland. Built by the Anglo-Normans in the early 1200s, it houses State Apartments, a Gothic chapel, and a medieval undercroft constructed directly on top of Viking foundations. It was here in January 1922 that one of Ireland's most iconic revolutionary figures formally accepted the handover of power from the British.",
ghost:"The Lady in Red is this location's most famous phantom, believed to be a noblewoman imprisoned and executed here during the 16th century. Her spectral figure, draped in crimson, drifts through the State Apartments after dark. Guards have reported phantom footsteps in empty corridors and doors slamming on windless nights. In the medieval Undercroft, where Viking Dublin lies buried beneath your feet, one archaeological team photographed a shadowy figure standing in a doorway where no person stood.",
answers:["dublin castle","the castle","castle"],
hint1:"This medieval fortress sits on Dame Street, directly adjacent to City Hall. It was the headquarters of British administration in Ireland for nearly 700 years.",
hint2:"There's a large cobbled courtyard, a round tower from the 1200s, and guided tours daily. It's simply named after the city it sits in."},

loc_d:{name:"City Hall",subtitle:"Dame Street",emoji:"\u{1F3DB}\uFE0F",lat:53.34395,lng:-6.26690,
clue:"Originally built as a commercial trading exchange in 1779, this magnificent domed building on Dame Street features twelve imposing columns and a stunning mosaic floor depicting Dublin's coat of arms. During the 1916 Easter Rising, rebel forces occupied the building. The first insurgent to die in the entire rebellion was shot by a sniper while defiantly raising a flag on its roof.",
ghost:"In 1916, fierce fighting raged inside these walls, and a young actor named Sean Connolly became the first rebel to fall. His ghost, in rebel uniform, has been reported pacing the rotunda late at night. Cleaning staff describe hearing echoes of gunfire that abruptly stop, followed by eerie silence. One security guard reported that every night at precisely five past midnight, the temperature in the rotunda drops sharply.",
answers:["city hall","dublin city hall","royal exchange"],
hint1:"This domed building sits directly across from Dublin Castle, at the top of Dame Street where it meets Lord Edward Street.",
hint2:"It has served as Dublin's civic administration centre since 1852. The circular rotunda beneath its dome is one of the most impressive free-to-enter interiors in the city."},

loc_e:{name:"Temple Bar",subtitle:"Crown Alley",emoji:"\u{1F37A}",lat:53.34540,lng:-6.26420,
clue:"This cobblestoned cultural quarter's name has nothing to do with drinking establishments. It was named after Sir William Temple, a 17th-century landowner and Provost of Trinity College, and the word Bar referred to a riverside walkway. Nearly demolished to make way for a bus terminal in the 1980s, it was saved by an arts campaign and is now Dublin's cultural quarter.",
ghost:"Beneath the cobblestones lie the bones of medieval Dublin. The most chilling tale belongs to Darkey Kelly, a woman in nearby Copper Alley during the 1700s who accused a powerful city official of wrongdoing. In revenge, he had her convicted of witchcraft and burned at the stake. Even today, people in these narrow lanes have reported smelling burning on perfectly clear evenings, and a dark-haired woman has been seen standing in doorways before dissolving into shadow.",
answers:["temple bar","temple bar dublin"],
hint1:"It's Dublin's most famous cultural quarter, a cobblestoned area south of the River Liffey, bounded by Dame Street to the south, known worldwide for its nightlife.",
hint2:"Bordered by Dame Street to the south and the River Liffey to the north, its main street gives its name to a well-known bank."},

loc_f:{name:"Olympia Theatre",subtitle:"Dame Street",emoji:"\u{1F3AD}",lat:53.34440,lng:-6.26530,
clue:"Originally called Dan Lowrey's Star of Erin Music Hall when it opened in 1879, this performance venue is one of Dublin's oldest and most beloved theatres. Its ornate Victorian interior has hosted Charlie Chaplin, Laurel and Hardy, David Bowie, and Radiohead. The founder died backstage in 1897, and according to theatre legend, his devotion to his creation was so absolute that he never truly departed.",
ghost:"Backstage, performers speak in hushed tones about the man in the balcony, a gaunt figure in Victorian dress who appears during rehearsals, watching the stage intently, fading when approached. Some believe he is the ghost of the theatre's original owner, who died backstage and refuses to leave. On one occasion, a night security guard heard the distinct sound of a single person applauding from a completely empty auditorium.",
answers:["olympia","olympia theatre","olympia theater","the olympia"],
hint1:"This Victorian theatre is on Dame Street. Look for the distinctive iron-and-glass canopy extending over the pavement.",
hint2:"It's named after Mount Olympus, home of the Greek gods. Its facade is blue and gold, on Dame Street between Dublin Castle and the Central Bank."},

loc_g:{name:"George's Street Arcade",subtitle:"South Great George's Street",emoji:"\u{1F3EA}",lat:53.34250,lng:-6.26380,
clue:"Opened in 1881, this is Dublin's oldest surviving indoor shopping arcade, a stunning Victorian structure of red brick and terracotta with a glass-vaulted roof. Gutted by fire in 1892, it was rebuilt even grander than before. Today its eclectic stalls include vintage clothing, record shops, jewellers, and fortune tellers. During construction in 1881, workers uncovered dozens of unmarked graves beneath the foundations.",
ghost:"The arcade was built on an old burial ground, and after the fire of 1892, people reported seeing figures moving in the smoke-blackened ruins. Today, stallholders who arrive early report hearing footsteps on the upper gallery when no one else has arrived. A woman in a long dark dress has been spotted browsing the stalls just before closing, only to vanish when approached. The fortune tellers who work here refuse to do readings after dark.",
answers:["georges street arcade","george street arcade","georges arcade","georges st arcade","south great georges street arcade"],
hint1:"This Victorian-era indoor market sits on South Great George's Street, running parallel to and west of Grafton Street.",
hint2:"It's a red-brick arcade with a glass roof \u2014 vintage shops, record stalls, and a famous fortune teller inside."},

loc_h:{name:"Molly Malone Statue",subtitle:"Suffolk Street",emoji:"\u{1F41A}",lat:53.34361,lng:-6.26100,
clue:"She wheeled her barrow through streets broad and narrow, crying cockles and mussels, alive alive oh. Whether she was a real person remains debated, though parish records from 1699 mention a Mary Malone who died young of a fever and was buried nearby. A bronze memorial to this iconic figure was unveiled in 1988 for Dublin's millennium celebration, and Dubliners nicknamed her the Tart with the Cart.",
ghost:"Late at night, around the old market district, people have heard the unmistakable creak of wooden cart wheels on cobblestones. A young woman in 17th-century dress has been reported pushing a barrow through the mist near Suffolk Street, only to dissolve when the fog lifts. Taxi drivers have reportedly picked up a young woman near the statue in the early hours. She asks to be taken to a churchyard, but when they arrive, the back seat is empty.",
answers:["molly malone","molly malone statue","tart with the cart","suffolk street statue","molly"],
hint1:"This famous bronze statue stands at the foot of Grafton Street, near the junction with Nassau Street and Suffolk Street.",
hint2:"One of Dublin's most photographed landmarks \u2014 a fishmonger with a cart overflowing with shellfish, on Suffolk Street."},

loc_i:{name:"Bank of Ireland",subtitle:"College Green",emoji:"\u{1F3E6}",lat:53.34430,lng:-6.25940,
clue:"The imposing building at College Green was originally the world's first purpose-built bicameral parliament, constructed between 1729 and 1739. After the Act of Union in 1800 abolished the Irish Parliament, the building was sold and has been occupied by a financial institution ever since. The original House of Lords chamber survives intact with 18th-century tapestries, an Irish crystal chandelier, and a silver-gilt mace.",
ghost:"In the old House of Lords chamber, employees working late have reported the sound of heated debate echoing from the empty room, ghostly parliamentarians arguing points of law long after their institution was abolished. The most famous apparition is Henry Grattan, the great orator who fought passionately against the Act of Union. His ghost, in full parliamentary dress, has been seen standing at the entrance on College Green.",
answers:["bank of ireland","college green","bank of ireland college green"],
hint1:"This building stands at College Green, directly opposite the main entrance gates to Trinity College Dublin.",
hint2:"Originally a parliament building. It's now one of Ireland's oldest and largest banks."},

loc_j:{name:"Christ Church Cathedral",subtitle:"Christchurch Place",emoji:"\u26EA",lat:53.34340,lng:-6.27130,
clue:"Founded around 1030 by the Norse King Sitric Silkenbeard, this is Dublin's oldest medieval building, predating even the Norman conquest of the city. It was rebuilt in stone by the Norman knight Strongbow in the 1170s after he seized Dublin. Its famous crypt, the largest in Ireland, stretches the entire length of the building. The Norman conqueror himself lies buried in the nave.",
ghost:"The crypt has been a place of dread for nearly a millennium. The most persistent ghost is Strongbow himself, whose armored shade has been seen kneeling at his tomb in the dead of night. The cathedral's most disturbing haunting involves a mummified cat and rat found trapped together inside an organ pipe, still on display in a glass case. Visitors report hearing unearthly yowling from the crypt, and on certain nights, a scratching from behind the stone walls.",
answers:["christ church","christ church cathedral","christchurch","christchurch cathedral","christ church dublin"],
hint1:"This medieval cathedral stands on a hill at Christchurch Place, connected by a covered stone bridge to the Dublinia museum next door.",
hint2:"Founded by a Viking king. You can hear its bells from some distance away."},

/* ============================================================
   HELPERS
   ============================================================ */
function haversine(la1,lo1,la2,lo2){
  var R=6371000, dLa=(la2-la1)*Math.PI/180, dLo=(lo2-lo1)*Math.PI/180;
  var sa=Math.sin(dLa/2), sb=Math.sin(dLo/2);
  var a=sa*sa+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*sb*sb;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function norm(s){
  return String(s).toLowerCase().replace(/[\u2018\u2019'`]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function matches(input,id){
  if(!input||input.trim().length<2) return false;
  var n=norm(input), list=LOCS[id].answers;
  for(var i=0;i<list.length;i++){
    var a=norm(list[i]);
    if(n===a) return true;
    if(n.indexOf(a)!==-1) return true;
    if(a.indexOf(n)!==-1 && n.length>=5) return true;
  }
  return false;
}
function pad(x){return x<10?"0"+x:""+x;}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec));
  var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h>0 ? h+":"+pad(m)+":"+pad(s) : m+":"+pad(s);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ============================================================
   STATE
   ============================================================ */
var S = {
  screen:"splash", teamNum:null, teamName:"",
  stopIdx:0, phase:"clue", hintLevel:0, feedback:null,
  gpsStatus:"idle", gpsMsg:"", gpsDist:null, showOverride:false,
  startMs:null, penaltySec:0, finalSec:null, finishedAt:null,
  log:[], resumed:false,
  speaking:false, ttsLoading:false, ttsError:""
};

var audioEl=null, audioCache={}, ticker=null;

function route(){ return S.teamNum ? ["start"].concat(ROUTES[S.teamNum]).concat(["end"]) : []; }
function curLoc(){ var r=route(); return r.length ? LOCS[r[S.stopIdx]] : null; }
function curId(){ var r=route(); return r.length ? r[S.stopIdx] : null; }
function elapsedSec(){
  if(S.finalSec!==null) return S.finalSec;
  if(!S.startMs) return 0;
  return Math.floor((Date.now()-S.startMs)/1000)+S.penaltySec;
}

/* per-stop record that feeds the finish summary */
function rec(){
  if(!S.log[S.stopIdx]){
    var L=curLoc();
    S.log[S.stopIdx]={
      name:L?L.name:"?", wrong:0, hints:0, revealed:false,
      penalty:0, arrivedSec:null, manual:false
    };
  }
  return S.log[S.stopIdx];
}

/* ============================================================
   SAVED PROGRESS  (survives reloads, locked screens, crashes)
   ============================================================ */
var SAVE_KEY="shadows_of_dublin_v1";

function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:1, screen:S.screen, teamNum:S.teamNum, teamName:S.teamName,
      stopIdx:S.stopIdx, phase:S.phase, hintLevel:S.hintLevel,
      startMs:S.startMs, penaltySec:S.penaltySec,
      finalSec:S.finalSec, finishedAt:S.finishedAt, log:S.log
    }));
  }catch(e){ /* private mode or full storage — game still playable */ }
}

function load(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var d=JSON.parse(raw);
    if(!d || !d.teamNum) return false;
    S.screen     = d.screen || "hunt";
    S.teamNum    = d.teamNum;
    S.teamName   = d.teamName || "";
    S.stopIdx    = d.stopIdx || 0;
    S.phase      = d.phase || "clue";
    S.hintLevel  = d.hintLevel || 0;
    S.startMs    = d.startMs || null;
    S.penaltySec = d.penaltySec || 0;
    S.finalSec   = (typeof d.finalSec === "number") ? d.finalSec : null;
    S.finishedAt = d.finishedAt || null;
    S.log        = d.log || [];
    return true;
  }catch(e){ return false; }
}

function wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ============================================================
   AUDIO  —  pre-made MP3 files, with a device-voice fallback
   ============================================================ */
var preloaded={};        /* "loc_a-clue" -> Audio element, or "missing" */

function akey(id,kind){ return id+"-"+kind; }
function apath(id,kind){ return AUDIO_DIR+id+"-"+kind+".mp3"; }
function atext(id,kind){ return kind==="clue" ? LOCS[id].clue : LOCS[id].ghost; }

/* Load the file into an <audio> element ahead of time so that the
   later play() call happens inside the tap, which mobile requires. */
function preload(id,kind){
  var k=akey(id,kind);
  if(preloaded[k]) return;
  var a=new Audio();
  a.preload="auto"; a.playsInline=true; a.setAttribute("playsinline","");
  a.addEventListener("error",function(){ preloaded[k]="missing"; },{once:true});
  a.src=apath(id,kind);
  try{ a.load(); }catch(e){}
  preloaded[k]=a;
}

function stopAudio(){
  if(audioEl){
    try{ audioEl.pause(); audioEl.currentTime=0; }catch(e){}
    audioEl=null;
  }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  S.speaking=false; S.ttsLoading=false;
}

/* Fallback: the phone's built-in voice.  Not as good, but it always works. */
function deviceSpeak(text){
  if(!window.speechSynthesis){ S.ttsNote="No narration available on this device."; render(); return; }
  window.speechSynthesis.cancel();
  var go=function(){
    var vs=window.speechSynthesis.getVoices();
    var v = pickVoice(vs,"en-IE") || pickVoice(vs,"en-GB") || pickVoice(vs,"en");
    var u=new SpeechSynthesisUtterance(text);
    if(v) u.voice=v;
    u.rate=0.85; u.pitch=0.8;
    u.onstart=function(){ S.speaking=true; render(); };
    u.onend=function(){ S.speaking=false; render(); };
    u.onerror=function(){ S.speaking=false; render(); };
    window.speechSynthesis.speak(u);
  };
  if(window.speechSynthesis.getVoices().length) go();
  else window.speechSynthesis.addEventListener("voiceschanged",go,{once:true});
}
function pickVoice(list,prefix){
  for(var i=0;i<list.length;i++){ if(list[i].lang && list[i].lang.indexOf(prefix)===0) return list[i]; }
  return null;
}

function speak(id,kind){
  stopAudio(); S.ttsError=""; S.ttsNote="";
  var k=akey(id,kind), a=preloaded[k];

  if(a && a!=="missing"){
    audioEl=a;
    a.onended=function(){ S.speaking=false; audioEl=null; render(); };
    var p=a.play();
    if(p && p.then){
      p.then(function(){ S.speaking=true; render(); })
       .catch(function(){
         audioEl=null;
         S.ttsNote="Narration file not found \u2014 using this device\u2019s voice.";
         deviceSpeak(atext(id,kind));
       });
    }else{ S.speaking=true; render(); }
    return;
  }

  S.ttsNote="Narration file not found \u2014 using this device\u2019s voice.";
  deviceSpeak(atext(id,kind));
}

function prefetch(){
  var id=curId(); if(!id) return;
  if(S.phase==="clue")  preload(id,"clue");
  if(S.phase==="ghost") preload(id,"ghost");
}

/* ---- rolled-up stats, shared by the screen and the text export ---- */
function tally(){
  var o={clean:0,hints:0,reveals:0,manual:0,wrong:0,stops:0};
  for(var i=0;i<S.log.length;i++){
    var r=S.log[i]; if(!r) continue;
    o.stops++;
    if(r.wrong===0) o.clean++;
    o.wrong+=r.wrong; o.hints+=r.hints;
    if(r.revealed) o.reveals++;
    if(r.manual) o.manual++;
  }
  return o;
}

function stopDetail(r){
  if(r.revealed) return "location revealed (+10:00)";
  if(r.wrong===0) return "solved first try";
  return r.wrong+" wrong \u00B7 "+r.hints+" hint"+(r.hints===1?"":"s")+" (+"+fmt(r.penalty)+")";
}

/* ---- plain-text summary for clipboard / email ---- */
function buildSummary(){
  var t=S.finalSec!==null?S.finalSec:elapsedSec();
  var g=tally();
  var when=S.finishedAt?new Date(S.finishedAt).toLocaleString():"";
  var L=[];
  L.push("SHADOWS OF DUBLIN \u2014 HUNT RESULTS");
  L.push("========================================");
  L.push("Team "+S.teamNum+": "+S.teamName);
  if(when) L.push("Finished: "+when);
  L.push("");
  L.push("FINAL TIME:   "+fmt(t));
  L.push("  Walking:    "+fmt(Math.max(0,t-S.penaltySec)));
  L.push("  Penalties:  "+fmt(S.penaltySec));
  L.push("");
  L.push("STOP BY STOP");
  L.push("----------------------------------------");
  for(var i=0;i<S.log.length;i++){
    var r=S.log[i]; if(!r) continue;
    L.push((i+1)+". "+r.name);
    L.push("    "+stopDetail(r)+
      (r.arrivedSec!==null?"  |  arrived "+fmt(r.arrivedSec):"")+
      (r.manual?"  |  manual check-in":""));
  }
  L.push("");
  L.push("TOTALS");
  L.push("----------------------------------------");
  L.push("Solved first try:    "+g.clean+" of "+g.stops);
  L.push("Wrong guesses:       "+g.wrong);
  L.push("Hints used:          "+g.hints);
  L.push("Locations revealed:  "+g.reveals);
  L.push("Manual check-ins:    "+g.manual);
  return L.join("\n");
}

    '<div class="stats">'+
      '<div class="stat"><b>'+g.clean+'/'+g.stops+'</b><span>solved first try</span></div>'+
      '<div class="stat"><b>'+g.wrong+'</b><span>wrong guesses</span></div>'+
      '<div class="stat"><b>'+g.hints+'</b><span>hints used</span></div>'+
      '<div class="stat"><b>'+g.reveals+'</b><span>revealed</span></div>'+
    '</div>'+

    '<p class="seclab">Stop by stop</p>'+
    '<div class="card" style="padding:4px 16px">'+rows+'</div>'+

    '<button class="btn mt" data-act="copy">\u{1F4CB} Copy Results</button>'+
    '<button class="btn ghostbtn" style="margin-top:8px" data-act="email">\u2709\uFE0F Email Results</button>'+

    '<p class="fine">You\u2019ve walked the haunted streets of Dublin and lived to tell the tale. '+
      'Send your results to your instructor \u2014 then rest. The spirits have earned it too.</p>'+
    '<button class="btn ghostbtn" style="margin-top:16px;opacity:.55" data-act="reset">\u21BA Start a New Hunt</button>'+
  '</div></div>';
}

function viewHunt(){
  var r=route(), loc=curLoc(), total=r.length, num=S.stopIdx+1;
  var pct=(S.stopIdx/(total-1))*100;
  var h='';

  h+='<div class="wrap">';
  h+='<div class="hdr"><div>'+
       '<p class="tname">'+esc(S.teamName)+'</p>'+
       '<p class="tsub">Stop '+num+' of '+total+' \u00B7 '+
         '<button class="linkbtn" data-act="reset">start over</button></p></div>'+
     '<div style="text-align:right">'+
       '<p class="tlab">Time</p>'+
       '<p class="tval" id="clock" style="color:'+(S.penaltySec>0?"var(--warn)":"var(--text)")+'">'+fmt(elapsedSec())+'</p>'+
       (S.penaltySec>0?'<p class="pen">+'+fmt(S.penaltySec)+' penalties</p>':'')+
     '</div></div>';

  if(S.resumed){
    h+='<div class="resumed">\u2713 Progress restored \u2014 picking up where you left off.</div>';
  }

  h+='<div class="bar"><div style="width:'+pct+'%"></div></div>';

  if(S.ttsError) h+='<div class="errbox">\u{1F50A} '+esc(S.ttsError)+'</div>';

  /* ---- CLUE ---- */
  if(S.phase==="clue"){
    h+='<div class="card" style="margin-bottom:14px">'+
         '<div class="cardrow"><span class="tag" style="color:var(--goldDim)">\u{1F4DC} Clue \u2014 Stop '+num+' of '+total+'</span>'+listenBtn()+'</div>'+
         '<p class="body">'+esc(loc.clue)+'</p></div>';

    if(S.hintLevel>=1) h+='<div class="hint"><span class="tag">\u{1F4A1} Hint 1 of 2</span><p>'+esc(loc.hint1)+'</p></div>';
    if(S.hintLevel>=2) h+='<div class="hint"><span class="tag">\u{1F4A1} Hint 2 of 2 (final)</span><p>'+esc(loc.hint2)+'</p></div>';
    if(S.hintLevel>=3) h+='<div class="reveal"><p class="big">\u{1F4CD} '+esc(loc.name)+'</p><p class="sm">+10:00 penalty applied</p></div>';

    if(S.feedback) h+='<div class="wrongbox"><p>'+esc(S.feedback.msg)+'</p><span>+'+fmt(S.feedback.penalty)+'</span></div>';

    if(S.hintLevel<3){
      h+='<div class="guessrow">'+
           '<input class="txt" id="guess" placeholder="Where are you headed?" autocomplete="off" autocapitalize="words">'+
           '<button class="btn" data-act="guess">Go</button></div>';
      if(S.hintLevel===1) h+='<p class="note">1 hint used \u00B7 1 remaining \u00B7 next wrong answer costs 2 more minutes</p>';
      if(S.hintLevel===2) h+='<p class="note">2 hints used \u00B7 next wrong answer reveals the location (+10:00)</p>';
    }else{
      h+='<button class="btn" data-act="proceed">Continue to '+esc(loc.name)+' \u2192</button>';
    }
  }

  /* ---- TRAVELING ---- */
  if(S.phase==="traveling"){
    h+='<div class="dest">'+
         '<div class="emoji">'+loc.emoji+'</div>'+
         '<span class="tag" style="color:var(--goldDim)">'+(S.hintLevel>=3?"\u{1F4CD} Destination Revealed":"\u2705 Correct \u2014 head to")+'</span>'+
         '<h3>'+esc(loc.name)+'</h3>'+
         (loc.subtitle?'<p class="sub">'+esc(loc.subtitle)+'</p>':'')+
       '</div>';
    h+='<button class="btn ghostbtn mb" data-act="directions">\u{1F5FA}\uFE0F Get Walking Directions</button>';
    h+='<div class="card">'+
         '<p class="mini">\u{1F441} Check in when you arrive to unlock the ghost story</p>';
    if(S.gpsStatus==="ok"){
      h+='<button class="btn okbtn" disabled>\u2705 Location Confirmed</button>';
    }else{
      h+='<button class="btn" data-act="checkin"'+(S.gpsStatus==="checking"?" disabled":"")+'>'+
         (S.gpsStatus==="checking"?"\u{1F4E1} Checking GPS\u2026":"\u{1F4CD} I\u2019m Here \u2014 Check In")+'</button>';
    }
    if(S.gpsStatus==="fail"){
      h+='<p class="gpsmsg">'+esc(S.gpsMsg)+'</p>';
      if(S.gpsDist!==null) h+='<p class="gpsdist">Measured distance: about '+S.gpsDist+' m</p>';
    }
    if(S.showOverride){
      h+='<button class="btn warnbtn" style="margin-top:10px" data-act="manual">\u270B Manual Check-In (we\u2019re standing here)</button>';
    }
    h+='</div>';
  }

  /* ---- GHOST ---- */
  if(S.phase==="ghost"){
    h+='<div class="ghostcard">'+
         '<div class="cardrow"><span class="tag">\u{1F47B} Ghost Story \u2014 '+esc(loc.name)+'</span>'+listenBtn()+'</div>'+
         '<p class="body">'+esc(loc.ghost)+'</p></div>';
    h+='<button class="btn" data-act="next">'+
       (S.stopIdx===total-1?"\u{1F3C6} Finish the Hunt":"Next Clue \u2192")+'</button>';
  }

  h+='</div>';
  return h;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var app=document.getElementById("app"), html;
  if(S.screen==="splash")        html=viewSplash();
  else if(S.screen==="setup")    html=viewSetup();
  else if(S.screen==="complete") html=viewComplete();
  else                           html=viewHunt();
  app.innerHTML=html;

  var g=document.getElementById("guess");
  if(g) g.focus();

  var tn=document.getElementById("tname");
  if(tn){
    tn.addEventListener("input",function(){ S.teamName=this.value; syncStartBtn(); });
  }
}
function syncStartBtn(){
  var b=document.querySelector('[data-act="begin"]');
  if(!b) return;
  if(S.teamNum && S.teamName.trim()) b.removeAttribute("disabled");
  else b.setAttribute("disabled","");
}
function tick(){
  var c=document.getElementById("clock");
  if(c) c.textContent=fmt(elapsedSec());
}

/* ============================================================
   GENERATOR  —  open this page with ?generate to build the MP3s
   ============================================================ */
function genItems(){
  var out=[],id;
  for(id in LOCS){
    if(!LOCS.hasOwnProperty(id)) continue;
    out.push({id:id,kind:"clue", name:LOCS[id].name, text:LOCS[id].clue});
    out.push({id:id,kind:"ghost",name:LOCS[id].name, text:LOCS[id].ghost});
  }
  return out;
}

function viewGenerate(){
  var items=genItems(), chars=0;
  for(var i=0;i<items.length;i++) chars+=items[i].text.length;
  return ''+
  '<div class="wrap">'+
    '<h2 class="head">Narration Builder</h2>'+
    '<p class="lede">Run this once to create the MP3 files. Paste an ElevenLabs API key, '+
      'generate, then put every downloaded file into an <b>audio</b> folder beside index.html '+
      'and commit it. After that the hunt needs no API key and no quota at all.</p>'+

    '<div class="card" style="margin-bottom:16px">'+
      '<div class="split" style="border:none;margin:0;padding:0">'+
        '<div>Files<b>'+items.length+'</b></div>'+
        '<div>Characters<b>'+chars.toLocaleString()+'</b></div>'+
      '</div>'+
      '<p class="note" style="margin-top:14px">The free ElevenLabs plan allows 10,000 characters '+
        'per month, so this run needs a paid month (Starter is about $5 for 30,000). '+
        'You only pay for it once \u2014 the files are yours afterwards.</p>'+
    '</div>'+

    '<label class="lbl" style="margin-top:0">ElevenLabs API Key</label>'+
    '<input class="txt" id="genkey" type="password" placeholder="sk_..." autocomplete="off">'+
    '<button class="btn mt" data-act="gen-run">Generate '+items.length+' files</button>'+
    '<p class="note">Your browser will ask permission to download multiple files \u2014 allow it. '+
      'Run this from your hosted https:// address rather than a local file.</p>'+

    '<div id="genlog" style="margin-top:18px"></div>'+
  '</div>';
}

function genLog(msg,color){
  var box=document.getElementById("genlog");
  if(!box) return;
  var p=document.createElement("p");
  p.style.cssText="font-family:var(--Fm);font-size:12px;margin:4px 0;color:"+(color||"var(--muted)");
  p.textContent=msg;
  box.appendChild(p);
  p.scrollIntoView({block:"nearest"});
}

function genRun(){
  var keyEl=document.getElementById("genkey");
  var key=keyEl?keyEl.value.trim():"";
  if(!key){ alert("Paste your ElevenLabs API key first."); return; }

  var btn=document.querySelector('[data-act="gen-run"]');
  if(btn){ btn.setAttribute("disabled",""); btn.textContent="Generating\u2026"; }

  var items=genItems(), i=0, failed=0;

  function step(){
    if(i>=items.length){
      genLog("", null);
      genLog(failed
        ? "Finished with "+failed+" failure(s). Re-run to retry those."
        : "All done. Move the downloads into your /audio folder.",
        failed?"var(--warn)":"var(--success)");
      if(btn){ btn.removeAttribute("disabled"); btn.textContent="Generate again"; }
      return;
    }
    var it=items[i], fname=it.id+"-"+it.kind+".mp3";
    genLog("["+(i+1)+"/"+items.length+"] "+fname+" \u2026");

    fetch("https://api.elevenlabs.io/v1/text-to-speech/"+EL_VOICE_ID,{
      method:"POST",
      headers:{"Accept":"audio/mpeg","Content-Type":"application/json","xi-api-key":key},
      body:JSON.stringify({text:it.text,model_id:"eleven_multilingual_v2",
        voice_settings:{stability:0.5,similarity_boost:0.8,style:0.3,use_speaker_boost:true}})
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error("HTTP "+r.status+" "+t.slice(0,110)); });
      return r.blob();
    }).then(function(blob){
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url; a.download=fname;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },5000);
      genLog("    saved "+fname,"var(--success)");
      i++; setTimeout(step,900);
    }).catch(function(e){
      failed++;
      genLog("    FAILED "+fname+" \u2014 "+e.message,"var(--danger)");
      i++; setTimeout(step,900);
    });
  }
  step();
}
function submitGuess(){
  var box=document.getElementById("guess");
  if(!box) return;
  var val=box.value;
  if(!val.trim()) return;

  S.resumed=false;
  var R=rec();

  if(matches(val,curId())){
    S.feedback=null; S.phase="traveling";
    stopAudio(); render(); save(); prefetch(); return;
  }

  R.wrong++;
  if(S.hintLevel===0){
    S.penaltySec+=120; R.penalty+=120; R.hints=1; S.hintLevel=1;
    S.feedback={msg:"Not quite. Here\u2019s your first hint.",penalty:120};
  }else if(S.hintLevel===1){
    S.penaltySec+=120; R.penalty+=120; R.hints=2; S.hintLevel=2;
    S.feedback={msg:"Still not it. One final hint.",penalty:120};
  }else{
    S.penaltySec+=600; R.penalty+=600; R.revealed=true; S.hintLevel=3;
    S.feedback={msg:"Out of hints \u2014 the location has been revealed.",penalty:600};
  }
  render(); save();
}

function doCheckIn(){
  var loc=curLoc();
  S.resumed=false;
  S.gpsStatus="checking"; S.gpsMsg=""; S.gpsDist=null; S.showOverride=false; render();

  if(!navigator.geolocation){
    S.gpsStatus="fail"; S.gpsMsg="This device can\u2019t provide GPS."; S.showOverride=true; render(); return;
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    var d=haversine(pos.coords.latitude,pos.coords.longitude,loc.lat,loc.lng);
    S.gpsDist=Math.round(d);
    if(d<=GPS_RADIUS){ arrive(false); }
    else{
      S.gpsStatus="fail";
      S.gpsMsg="You\u2019re about "+Math.round(d)+" m away. Move closer and try again.";
      S.showOverride=true; render();
    }
  },function(err){
    S.gpsStatus="fail";
    S.gpsMsg = err.code===1
      ? "Location access was denied. Enable it in your browser settings, or check in manually."
      : "Couldn\u2019t get a GPS fix. Try again, or check in manually.";
    S.showOverride=true; render();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function arrive(manualFlag){
  var R=rec();
  R.arrivedSec=elapsedSec();
  R.manual=!!manualFlag;
  S.gpsStatus="ok"; render(); save();
  setTimeout(function(){
    S.phase="ghost"; S.gpsStatus="idle"; S.showOverride=false; S.gpsDist=null;
    stopAudio(); render(); save(); prefetch();
  },700);
}

function nextStop(){
  var r=route();
  S.resumed=false;
  if(S.stopIdx+1>=r.length){
    S.finalSec=elapsedSec();
    S.finishedAt=Date.now();
    if(ticker){ clearInterval(ticker); ticker=null; }
    stopAudio(); S.screen="complete"; render(); save(); return;
  }
  S.stopIdx++; S.phase="clue"; S.hintLevel=0; S.feedback=null;
  S.gpsStatus="idle"; S.gpsMsg=""; S.gpsDist=null; S.showOverride=false; S.ttsError="";
  rec();
  stopAudio(); render(); save(); prefetch();
}

/* ---- clipboard, with a fallback for older mobile browsers ---- */
function copyText(txt,onDone){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(onDone).catch(function(){ legacyCopy(txt,onDone); });
  }else{ legacyCopy(txt,onDone); }
}
function legacyCopy(txt,onDone){
  try{
    var ta=document.createElement("textarea");
    ta.value=txt;
    ta.style.position="fixed"; ta.style.left="-9999px";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length);
    document.execCommand("copy");
    document.body.removeChild(ta);
    onDone();
  }catch(e){
    alert("Couldn\u2019t copy automatically \u2014 please screenshot this page instead.");
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click",function(ev){
  var el=ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  var act=el.getAttribute("data-act");

  if(act==="to-setup"){ S.screen="setup"; render(); }

  else if(act==="to-splash"){ S.screen="splash"; render(); }

  else if(act==="team"){ S.teamNum=parseInt(el.getAttribute("data-n"),10); render(); }

  else if(act==="begin"){
    if(!S.teamNum || !S.teamName.trim()) return;
    S.screen="hunt"; S.stopIdx=0; S.phase="clue"; S.hintLevel=0; S.feedback=null;
    S.startMs=Date.now(); S.penaltySec=0; S.finalSec=null; S.finishedAt=null;
    S.log=[]; S.resumed=false; audioCache={};
    if(ticker) clearInterval(ticker);
    ticker=setInterval(tick,1000);
    rec();
    render(); save(); prefetch();
  }

  else if(act==="guess"){ submitGuess(); }

  else if(act==="proceed"){
    S.phase="traveling"; S.feedback=null; S.resumed=false;
    stopAudio(); render(); save(); prefetch();
  }

  else if(act==="listen"){
    var id=curId(); if(!id) return;
    if(S.speaking||S.ttsLoading){ stopAudio(); render(); }
    else{ speak(id, S.phase==="ghost" ? "ghost" : "clue"); }
  }

  else if(act==="gen-run"){ genRun(); }

  else if(act==="directions"){
    var L=curLoc();
    window.open("https://www.google.com/maps/dir/?api=1&destination="+L.lat+","+L.lng+"&travelmode=walking","_blank");
  }

  else if(act==="checkin"){ doCheckIn(); }

  else if(act==="manual"){ S.showOverride=false; arrive(true); }

  else if(act==="next"){ nextStop(); }

  else if(act==="copy"){
    var original=el.innerHTML;
    copyText(buildSummary(),function(){
      el.innerHTML="\u2705 Copied to clipboard";
      setTimeout(function(){ el.innerHTML=original; },2200);
    });
  }

  else if(act==="email"){
    var subj="Shadows of Dublin \u2014 Team "+S.teamNum+" ("+S.teamName+")";
    window.location.href="mailto:?subject="+encodeURIComponent(subj)+
                         "&body="+encodeURIComponent(buildSummary());
  }

  else if(act==="reset"){
    if(window.confirm("Start over? This erases your team\u2019s progress and resets the timer.")){
      wipe();
      window.location.href=window.location.pathname;
    }
  }
});

document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter" && ev.target && ev.target.id==="guess"){
    ev.preventDefault(); submitGuess();
  }
});

/* surface the "using device voice" notice through the existing banner */
var baseRender=render;
render=function(){
  if(S.ttsNote && !S.ttsError) S.ttsError=S.ttsNote;
  baseRender();
};

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  /* ?generate  -> one-time narration builder, no saved state touched */
  if(window.location.search.indexOf("generate")!==-1){
    document.getElementById("app").innerHTML=viewGenerate();
    return;
  }
  if(window.location.search.indexOf("reset")!==-1){ wipe(); }

  var restored=load();
  if(restored){
    S.resumed=true;
    if(S.screen==="hunt" && S.finalSec===null){
      if(ticker) clearInterval(ticker);
      ticker=setInterval(tick,1000);
    }
  }
  render();
  if(restored && S.screen==="hunt") prefetch();
}

boot();

})();
</script>
