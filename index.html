<!DOCTYPE html>
<html lang="en">
<head>

<title>Shadows of Dublin — A Haunted Walking Scavenger Hunt</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--card:#13131d;--border:#2a2a3a;
  --gold:#c9a84c;--goldDim:#8a7233;--goldBg:rgba(201,168,76,.15);
  --text:#e8e4d9;--muted:#8a8677;
  --danger:#e05555;--dangerBg:rgba(224,85,85,.12);
  --success:#4cc96a;--successBg:rgba(76,201,106,.1);
  --warn:#c9944c;--warnBg:rgba(201,148,76,.12);
  --purple:#b090e0;--purpleBg:rgba(100,60,180,.12);
  --Fd:'Playfair Display',Georgia,serif;--Fb:'Source Serif 4',Palatino,serif;--Fm:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);min-height:100%;-webkit-tap-highlight-color:transparent}
body{font-family:var(--Fb);color:var(--text);line-height:1.5;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.985)}
input{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 60px;min-height:100vh}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.centerbox{max-width:400px;width:100%}
.splashbg{background:radial-gradient(ellipse at 50% 25%,#1a1a2a,var(--bg) 65%)}
.donebg{background:radial-gradient(ellipse at 50% 22%,#0e1f0e,var(--bg) 62%);min-height:100vh}
h1.logo{font-family:var(--Fd);font-size:50px;font-weight:900;color:var(--gold);line-height:1.05;margin:6px 0;letter-spacing:-1px;text-shadow:0 0 40px rgba(201,168,76,.25)}
h1.logo em{font-weight:400;font-size:26px;color:var(--muted)}
.ghosticon{font-size:64px;filter:drop-shadow(0 0 24px rgba(201,168,76,.5));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.shamrock{color:var(--goldDim);font-size:13px;letter-spacing:12px;margin:14px 0}
.tagline{font-family:var(--Fd);font-size:16px;font-style:italic;margin:6px 0 4px}
.route{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:0 0 26px}
.fine{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}
.btn{display:block;width:100%;border-radius:8px;padding:13px 20px;font-size:15px;font-weight:700;font-family:var(--Fd);letter-spacing:.5px;transition:all .15s;border:2px solid var(--gold);color:var(--gold);background:transparent}
.btn:hover{background:var(--gold);color:#000}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.solid{background:var(--gold);color:#000}
.btn.ghostbtn{border-color:var(--border);color:var(--muted);border-width:1px;font-family:var(--Fb);font-weight:400;font-size:14px}
.btn.ghostbtn:hover{background:transparent;color:var(--text);border-color:var(--muted)}
.btn.warnbtn{border-color:rgba(201,148,76,.45);background:var(--warnBg);color:var(--warn);border-width:1px;font-family:var(--Fb);font-weight:400;font-size:14px}
.btn.okbtn{background:var(--success);border-color:var(--success);color:#000}
.backlink{background:none;border:none;color:var(--gold);font-family:var(--Fb);font-size:15px;padding:4px 0 12px;display:block}
.linkbtn{background:none;border:none;padding:0;font-family:var(--Fm);font-size:11px;color:var(--muted);text-decoration:underline}
h2.head{font-family:var(--Fd);font-size:26px;font-weight:700;color:var(--gold);margin:0 0 8px}
.lede{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 20px}
label.lbl{display:block;font-family:var(--Fd);font-size:13px;font-weight:600;margin:20px 0 8px;letter-spacing:.5px}
.teamgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.teambtn{font-family:var(--Fm);font-size:18px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 0;transition:all .15s}
.teambtn.on{color:var(--gold);background:var(--goldBg);border-color:var(--gold)}
input.txt{width:100%;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;outline:none}
input.txt:focus{border-color:var(--gold)}
.rules{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:20px;font-size:13px;line-height:1.7;color:var(--muted)}
.rules b{color:var(--text)}
.rules ol{margin:6px 0 0;padding-left:20px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.hdr .tname{font-family:var(--Fd);font-size:17px;font-weight:700;color:var(--gold);margin:0}
.hdr .tsub{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:2px 0 0}
.hdr .tlab{font-family:var(--Fm);font-size:10px;color:var(--muted);margin:0;text-transform:uppercase;letter-spacing:1px}
.hdr .tval{font-family:var(--Fm);font-size:24px;font-weight:700;margin:0}
.hdr .pen{font-family:var(--Fm);font-size:10px;color:var(--warn);margin:0}
.resumed{background:var(--successBg);border:1px solid rgba(76,201,106,.3);border-radius:8px;padding:9px 13px;margin-bottom:14px;font-family:var(--Fm);font-size:11px;color:var(--success)}
.bar{height:5px;background:var(--border);border-radius:3px;margin-bottom:8px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--goldDim),var(--gold));transition:width .6s}
.barlab{font-family:var(--Fm);font-size:11px;color:var(--muted);text-align:right;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.cardrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tag{font-family:var(--Fm);font-size:10px;text-transform:uppercase;letter-spacing:2px;display:block}
.body{font-size:15px;line-height:1.85;margin:0}
.listen{font-family:var(--Fm);font-size:11px;letter-spacing:.5px;border-radius:20px;padding:6px 14px;white-space:nowrap;border:1px solid rgba(201,168,76,.4);background:var(--goldBg);color:var(--gold)}
.listen.playing{border-color:rgba(224,85,85,.45);background:var(--dangerBg);color:var(--danger)}
.hint{background:var(--warnBg);border:1px solid rgba(201,148,76,.3);border-radius:10px;padding:16px;margin-bottom:12px}
.hint .tag{color:var(--warn);margin-bottom:8px}
.hint p{font-size:14px;margin:0;line-height:1.7}
.wrongbox{background:var(--dangerBg);border:1px solid rgba(224,85,85,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wrongbox p{color:var(--danger);font-size:13px;margin:0;line-height:1.5}
.wrongbox span{font-family:var(--Fm);font-size:12px;color:var(--danger);font-weight:700;white-space:nowrap}
.guessrow{display:flex;gap:8px;margin-top:4px}
.guessrow input{flex:1;min-width:0}
.guessrow button{width:auto;padding:12px 22px;font-size:14px;flex-shrink:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;font-style:italic;text-align:center}
.dest{background:linear-gradient(135deg,rgba(201,168,76,.14),rgba(201,168,76,.04));border:1px solid rgba(201,168,76,.35);border-radius:14px;padding:22px 20px;margin-bottom:14px;text-align:center}
.dest.revealed{background:linear-gradient(135deg,rgba(201,148,76,.18),rgba(201,148,76,.05));border-color:var(--warn)}
.dest .emoji{font-size:48px;margin-bottom:8px}
.dest h3{font-family:var(--Fd);font-size:26px;font-weight:700;color:var(--gold);margin:4px 0}
.dest .sub{font-family:var(--Fm);font-size:12px;color:var(--muted);margin:0}
.dest .pennote{font-family:var(--Fm);font-size:12px;color:var(--warn);margin:8px 0 0}
.ghostcard{background:var(--purpleBg);border:1px solid rgba(176,144,224,.3);border-radius:12px;padding:20px;margin-bottom:16px}
.ghostcard .tag{color:var(--purple)}
.histcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px}
.histcard .tag{color:var(--goldDim)}
.tabrow{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabb{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--Fd);font-size:15px;font-weight:600;padding:10px 0}
.tabb.on{color:var(--gold);border-bottom-color:var(--gold)}
.player{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.pbtn{width:42px;height:42px;border-radius:50%;background:var(--gold);border:none;color:#000;font-size:18px;flex-shrink:0}
.pinfo{flex:1;min-width:0}
.plab{font-family:var(--Fm);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.pprog{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.pprog>div{height:100%;background:var(--gold);width:0}
.ptime{font-family:var(--Fm);font-size:11px;color:var(--muted);flex-shrink:0}
.arrived{background:var(--successBg);border:1px solid rgba(76,201,106,.35);border-radius:10px;padding:12px;margin-bottom:14px;text-align:center;font-family:var(--Fd);color:var(--success);font-weight:600}
.gpsmsg{color:var(--danger);font-size:13px;margin:10px 0 2px;line-height:1.5}
.gpsdist{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:2px 0 0}
.mini{font-family:var(--Fm);font-size:11px;color:var(--muted);margin:0 0 12px;text-transform:uppercase;letter-spacing:1px}
.journey{margin-top:26px}
.jrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
.jrow:last-child{border-bottom:none}
.jdot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--Fm);font-size:12px;font-weight:700;flex-shrink:0;background:var(--border);color:var(--muted)}
.jrow.done .jdot{background:var(--success);color:#000}
.jrow.cur .jdot{background:var(--gold);color:#000}
.jname{flex:1;font-family:var(--Fd);font-size:14px}
.jrow.locked .jname,.jrow.cur .jname{color:var(--muted);font-style:italic}
.jt{font-family:var(--Fm);font-size:11px;color:var(--gold)}
.finaltime{font-family:var(--Fm);font-size:46px;font-weight:700;margin:0;color:var(--gold)}
.mt{margin-top:24px}.mb{margin-bottom:10px}
.sumwrap{max-width:520px;margin:0 auto;padding:26px 16px 64px;text-align:center}
.srow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);text-align:left}
.srow:last-child{border-bottom:none}
.sn{font-family:var(--Fm);font-size:12px;color:var(--muted);width:20px;flex-shrink:0;padding-top:3px}
.sp{flex:1;min-width:0}
.sp b{display:block;font-family:var(--Fd);font-size:14px;font-weight:600;color:var(--text)}
.sp span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.st{font-family:var(--Fm);font-size:12px;color:var(--gold);flex-shrink:0;padding-top:4px}
.split{display:flex;justify-content:space-around;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.split div{font-family:var(--Fm);font-size:11px;color:var(--muted)}
.split b{display:block;font-size:15px;color:var(--text);margin-top:3px}
.seclab{font-family:var(--Fm);font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);text-align:left;margin:26px 0 8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ============================================================
   SETTINGS — change these to tune the game
   ============================================================ */
var CHECK_IN_RADIUS_M = 7.62;   // ~25 ft
var GPS_SLACK_MAX_M   = 10;     // phone GPS is rarely better than 5–10 m; up to this much of the reported accuracy is forgiven
var PENALTY_WRONG_1   = 180;    // seconds added after the 1st wrong guess (then a hint is shown)
var PENALTY_WRONG_2   = 600;    // seconds added after the 2nd wrong guess (then the location is revealed)
var MANUAL_AFTER_TRIES= 2;      // failed GPS attempts before the manual check-in button appears
var SAVE_KEY          = "shadows_of_dublin_hunt_v2";

/* ============================================================
   LOCATIONS — names, coordinates, history and ghost stories
   ============================================================ */
const LOCATIONS={start:{id:"start",name:"St. Stephen's Green",lat:53.33815,lng:-6.25914,emoji:"🌿",history:"St. Stephen's Green has been a public park since 1664, making it one of Dublin's oldest. Originally a marshy common used for public hangings and floggings, the Green was enclosed in 1814 and redesigned by Sir Arthur Guinness in 1880. During the 1916 Easter Rising, rebel forces under Michael Mallin and Constance Markievicz dug trenches here and exchanged fire with British soldiers stationed on the rooftops of the Shelbourne Hotel. Bullet holes can still be found in buildings surrounding the park.",ghost:"On foggy evenings, visitors to the Green have reported hearing the phantom crack of a hangman's rope near the northwest corner — where public executions took place for over a century. The most persistent sighting is of a woman in grey who walks the perimeter path after midnight, believed to be the shade of a young woman executed in 1798 for aiding rebel forces. Groundskeepers have reported finding the flower beds near the Wolfe Tone memorial disturbed in the mornings, with no footprints leading in or out — as if something had risen from the earth itself."},end:{id:"end",name:"Trinity College Dublin",lat:53.34384,lng:-6.25460,emoji:"📚",history:"Founded in 1592 by Queen Elizabeth I, Trinity College is Ireland's oldest university. Its iconic Long Room library holds over 200,000 of its oldest books, including the legendary Book of Kells — a masterwork of medieval art created by Celtic monks around 800 AD. Notable alumni include Oscar Wilde, Samuel Beckett, Jonathan Swift, and Bram Stoker, who studied here before writing Dracula. The campus's oldest surviving building, The Rubrics, dates from around 1700.",ghost:"Bram Stoker walked these cobblestones before penning the most famous horror novel ever written — and some say he drew early inspiration from the campus itself. The ghost of Edward Ford, a lecturer who died in the 1700s, is said to haunt The Rubrics wearing a powdered wig, academic gown, and knee breeches. Students have reported seeing his pale figure gliding between rooms on the upper floors. In the Long Room, night security guards have heard the unmistakable sound of pages turning when no one else is present — as if some scholarly spirit cannot rest until they finish their reading."},loc_a:{id:"loc_a",name:"St. Ann's Church",subtitle:"Dawson Street",lat:53.34095,lng:-6.25730,emoji:"⛪",history:"Built in 1720, St. Ann's Church on Dawson Street is one of Dublin's most historic parish churches. Its striking Romanesque façade was added in 1868. The church has a long tradition of charity — a bread shelf, endowed in 1723, still provides bread to the poor of the parish to this day. Famous parishioners have included Wolfe Tone, Bram Stoker (who was married here in 1878), and Douglas Hyde, the first President of Ireland.",ghost:"It was in this very church that Bram Stoker married Florence Balcombe in 1878 — the same woman Oscar Wilde had once courted. Some say Wilde's jealous spirit has never forgiven the slight. Late-night passersby have heard the faint strains of organ music drifting from the locked church, though no organist is present. A verger in the 1960s reported seeing a tall figure in a velvet coat standing in the gallery, watching the empty pews below with an expression of profound sadness. When he called out, the figure vanished — leaving only the lingering scent of lilies."},loc_b:{id:"loc_b",name:"Powerscourt Townhouse",subtitle:"South William Street",lat:53.34190,lng:-6.26240,emoji:"🏛️",history:"This magnificent Georgian townhouse was built in 1774 for Richard Wingfield, 3rd Viscount Powerscourt. Designed by Robert Mack, it features one of the finest Georgian interiors in Dublin, with elaborate plasterwork by Michael Stapleton. The grand mahogany staircase and ornate reception rooms once hosted lavish balls for Dublin's aristocracy. Converted to a shopping centre in 1981, the building retains its aristocratic grandeur beneath the modern retail.",ghost:"The ghost of a serving girl has been seen on the grand staircase, always climbing, never arriving. According to legend, she was a maid in the Powerscourt household who fell to her death from the upper gallery during a grand ball in the 1790s — some whisper she was pushed by a jealous rival. Shopkeepers on the upper floors report items rearranging themselves overnight and the sound of rustling fabric in empty corridors. One night watchman refused to return after hearing a woman's voice whispering \"help me\" from the empty stairwell at 3 AM."},loc_c:{id:"loc_c",name:"Dublin Castle",subtitle:"Dame Street",lat:53.34320,lng:-6.26740,emoji:"🏰",history:"Dublin Castle has been at the heart of Irish history since the Anglo-Normans built a fortress here in the early 1200s. For over 700 years it served as the seat of British rule in Ireland. The castle complex includes the State Apartments, the Chapel Royal with its stunning Gothic exterior, and the medieval Undercroft — the original Viking foundations upon which the castle was built. It was here in 1922 that Michael Collins formally accepted the handover of power from the British.",ghost:"The \"Lady in Red\" is Dublin Castle's most famous phantom — believed to be a noblewoman imprisoned and executed within these walls during the 16th century. Her spectral figure, draped in a flowing crimson gown, has been spotted drifting through the State Apartments after dark. Guards have reported the sound of phantom footsteps echoing through empty corridors and doors slamming shut on windless nights. In the medieval Undercroft, where Viking Dublin lies buried, archaeologists have reported an oppressive feeling of being watched — and one team photographed a shadowy figure standing in a doorway where no person stood."},loc_d:{id:"loc_d",name:"City Hall",subtitle:"Dame Street",lat:53.34395,lng:-6.26690,emoji:"🏛️",history:"Designed by Thomas Cooley and completed in 1779, City Hall was originally the Royal Exchange — Dublin's commercial trading centre. Its spectacular rotunda, supported by twelve columns, features a beautiful mosaic floor depicting the Dublin coat of arms. During the 1916 Easter Rising, the building was occupied by rebel forces and came under heavy fire from nearby Dublin Castle. Bullet marks can still be seen on the columns. It has served as Dublin's City Hall since 1852.",ghost:"During the 1916 Rising, fierce fighting raged inside this building. A young rebel named Seán Connolly was the first insurgent to die in the rebellion, shot by a sniper while raising a flag on the roof. His ghost, in rebel uniform, has been reported pacing the rotunda late at night. Cleaning staff have described hearing the echo of gunfire that abruptly stops, followed by an eerie silence. One security guard reported that every night at precisely 12:05 — the approximate time Connolly fell — the temperature in the rotunda drops sharply, regardless of season."},loc_e:{id:"loc_e",name:"Temple Bar",subtitle:"Crown Alley",lat:53.34540,lng:-6.26420,emoji:"🍺",history:"Temple Bar takes its name not from any drinking establishment but from the Temple family — Sir William Temple was Provost of Trinity College and owned land here in the 1600s. \"Bar\" referred to a riverside walkway. The cobblestoned quarter nearly became a bus terminal in the 1980s before an arts campaign saved it. Today it's Dublin's cultural quarter, home to galleries, theatres, vintage shops, and of course, some of the city's most famous pubs. The area sits atop medieval Dublin and Viking trading routes.",ghost:"Beneath the cobblestones of Temple Bar lie the bones of medieval Dublin. The most chilling tale belongs to Darkey Kelly, a brothel owner in nearby Copper Alley during the 1700s. She accused a powerful city official of fathering her child — and in revenge, he had her convicted of witchcraft and burned at the stake. Her agonized screams reportedly echoed through these streets for years afterward. Even today, people in the narrow lanes around Crown Alley have reported smelling burning on perfectly clear evenings, and a dark-haired woman has been seen standing in doorways, watching passersby with hollow eyes before dissolving into shadow."},loc_f:{id:"loc_f",name:"Olympia Theatre",subtitle:"Dame Street",lat:53.34440,lng:-6.26530,emoji:"🎭",history:"The Olympia Theatre, originally \"Dan Lowrey's Star of Erin Music Hall,\" opened in 1879. It is one of Dublin's oldest and most beloved performance venues. Its ornate Victorian interior has hosted everyone from Charlie Chaplin and Laurel & Hardy to David Bowie and Radiohead. The distinctive canopy entrance on Dame Street is one of the most recognisable facades in the city.",ghost:"Backstage at the Olympia, performers speak in hushed tones about \"the man in the balcony.\" He appears in the upper gallery during rehearsals — a gaunt figure in Victorian dress, watching the stage intently. When actors look directly at him, he fades from view. Some believe he is the ghost of Dan Lowrey himself, the theatre's original owner, who died backstage in 1897 and whose devotion to his theatre apparently survived death. Stagehands have reported props moving on their own, lights flickering in sequence as if operated by unseen hands, and on one occasion, the distinct sound of a single person applauding from an empty auditorium."},loc_g:{id:"loc_g",name:"George's Street Arcade",subtitle:"South Great George's St",lat:53.34250,lng:-6.26380,emoji:"🏪",history:"Opened in 1881 as the South City Markets, George's Street Arcade is Dublin's oldest red-brick Victorian market. Designed by Lockwood & Mawson, it features a stunning glass-roofed interior. The market was gutted by fire in 1892 but rebuilt to an even grander design. Today it houses an eclectic mix of vintage clothing stalls, record shops, jewellers, fortune tellers, and food vendors.",ghost:"The Arcade was built on the site of an old burial ground, and during construction in 1881, workers uncovered dozens of unmarked graves — victims of various plagues that swept through the Liberties. After the great fire of 1892, people reported seeing figures in the smoke-blackened ruins before rebuilding began. Today, stallholders who arrive early in the morning report hearing footsteps on the upper gallery when no one else has arrived, and a woman in a long dark dress has been spotted browsing the stalls just before closing — only to vanish when approached."},loc_h:{id:"loc_h",name:"Molly Malone Statue",subtitle:"Suffolk Street",lat:53.34361,lng:-6.26100,emoji:"🐚",history:"The bronze statue of Molly Malone — \"The Tart with the Cart\" as Dubliners affectionately call her — was unveiled in 1988 for Dublin's millennium celebration. She commemorates the legendary fishmonger from the famous Irish folk song. Whether Molly was a real person remains debated, but parish records from 1699 show a Mary Malone who died and was buried in St. John's Church graveyard. The statue was moved to Suffolk Street in 2014.",ghost:"They say Molly Malone died of a fever — but some Dubliners insist she never truly left these streets. Late at night, around the old market district, people have heard the unmistakable creak of a wooden cart wheel on cobblestones. A few have reported seeing a young woman in 17th-century dress pushing a barrow through the mist near Suffolk Street, only for her to dissolve when the fog lifts. The most unnerving accounts come from taxi drivers who've reported picking up a young woman near the statue in the early hours — she asks to go to St. John's churchyard, but when they arrive at the destination, the back seat is empty."},loc_i:{id:"loc_i",name:"Bank of Ireland",subtitle:"College Green",lat:53.34430,lng:-6.25940,emoji:"🏦",history:"This magnificent building on College Green was originally the Irish Houses of Parliament, built between 1729 and 1739 — the world's first purpose-built bicameral parliament. After the Act of Union in 1800 abolished the Irish Parliament, the building was sold to the Bank of Ireland, which has occupied it since 1803.",ghost:"In the old House of Lords chamber, bank employees working late have reported the sound of heated debate echoing from the empty room — ghostly parliamentarians arguing points of law two centuries after their institution was abolished. The most famous apparition is that of Henry Grattan, the great orator who fought passionately against the Act of Union. His ghost, in full parliamentary dress, has been seen standing at the entrance on College Green, as if arriving for a session that will never begin."},loc_j:{id:"loc_j",name:"Christ Church Cathedral",subtitle:"Christchurch Place",lat:53.34340,lng:-6.27130,emoji:"⛪",history:"Christ Church Cathedral is Dublin's oldest medieval building, founded around 1030 by the Norse King Sitric Silkenbeard. It was rebuilt in stone by the Norman knight Strongbow in the 1170s. The cathedral's famous crypt — the largest in Ireland — stretches the entire length of the building and contains artifacts spanning a thousand years, including the famous mummified cat and rat found trapped in an organ pipe.",ghost:"The crypt of Christ Church has been a place of dread for nearly a millennium. The most persistent ghost is that of Strongbow himself — the Norman conqueror whose armored shade has been seen kneeling at his tomb in the dead of night. But the cathedral's most disturbing haunting involves the mummified cat and rat, found entombed together in an organ pipe centuries ago. Visitors report hearing an unearthly yowling from the crypt, and on certain nights, a scratching sound issues from behind the stone walls — as if something long dead is still trying to claw its way out."},loc_k:{id:"loc_k",name:"The Brazen Head",subtitle:"20 Lower Bridge Street",lat:53.34470,lng:-6.27600,emoji:"🍻",history:"The Brazen Head claims the title of Ireland's oldest pub, with records dating its establishment to 1198. Its low ceilings, creaking floorboards, and labyrinthine r     '<input class="txt" id="tname" maxlength="30" placeholder="e.g. The Banshee Chasers" value="'+esc(S.teamName)+'">'+
    '<div class="rules"><b>How it works</b><ol>'+
      '<li>Read the clue and work out where it points.</li>'+
      '<li>Type your guess. A wrong guess adds <b>+'+fmt(PENALTY_WRONG_1)+'</b> and gives you a hint.</li>'+
      '<li>A second wrong guess adds <b>+'+fmt(PENALTY_WRONG_2)+'</b> and reveals the destination.</li>'+
      '<li>Walk there and check in by GPS within about 25 ft to unlock its ghost story.</li>'+
      '<li>Your final time (walking + penalties) is recorded when you reach the last stop.</li>'+
    '</ol></div>'+
    '<button class="btn mt" data-act="begin"'+(ready?"":" disabled")+'>Start the Hunt \u{1F47B}</button>'+
    '<p class="note">The clock starts when you press Start. Progress saves automatically, so you can lock your phone or reload.</p>'+
  '</div>';
}
function header(){
  var r=route(),total=r.length,done=S.log.filter(function(x){return x&&x.arrivedSec!==null;}).length;
  return '<div class="hdr"><div><p class="tname">'+esc(S.teamName)+'</p>'+
      '<p class="tsub">Team '+S.teamNum+' · <button class="linkbtn" data-act="reset">start over</button></p></div>'+
    '<div style="text-align:right"><p class="tlab">'+(S.finalSec!==null?"Final time":"Time")+'</p>'+
      '<p class="tval" id="clock" style="color:'+(S.penaltySec>0?"var(--warn)":"var(--text)")+'">'+fmt(elapsedSec())+'</p>'+
      (S.penaltySec>0?'<p class="pen">incl. +'+fmt(S.penaltySec)+' penalties</p>':'')+'</div></div>'+
    (S.resumed?'<div class="resumed">✓ Progress restored — picking up where you left off.</div>':'')+
    '<div class="bar"><div style="width:'+(done/total*100)+'%"></div></div>'+
    '<p class="barlab">'+done+' of '+total+' stops checked off</p>';
}
function journeyList(){
  var r=route(),h='<p class="seclab">Your journey</p><div class="card" style="padding:4px 16px">';
  r.forEach(function(id,i){
    var L=S.log[i],done=L&&L.arrivedSec!==null,cur=i===S.stopIdx&&!done,known=done||(cur&&S.phase!=="clue");
    var nm=known?(LOCATIONS[id].emoji+" "+LOCATIONS[id].name):(cur?"Destination unknown — solve the clue":"❓ Hidden");
    h+='<div class="jrow '+(done?"done":cur?"cur":"locked")+'"><div class="jdot">'+(done?"✓":(i+1))+'</div>'+
       '<div class="jname" style="'+(known&&!done?"color:var(--text);font-style:normal":"")+'">'+esc(nm)+'</div>'+
       (done?'<div class="jt">'+fmt(L.arrivedSec)+'</div>':(i>S.stopIdx?'<div class="jt" style="color:var(--muted)">\u{1F512}</div>':''))+'</div>';
  });
  return h+'</div>';
}
function viewHunt(){
  var r=route(),total=r.length,num=S.stopIdx+1,loc=curLoc(),P=curPuz(),R=rec(),last=S.stopIdx===total-1;
  var h='<div class="wrap">'+header();

  if(S.phase==="clue"){
    h+='<div class="card" style="margin-bottom:14px"><div class="cardrow"><span class="tag" style="color:var(--goldDim)">\u{1F4DC} Clue — Stop '+num+' of '+total+(last?" (final stop)":"")+'</span>'+
       '<button class="listen'+(speaking?" playing":"")+'" data-act="speak">'+(speaking?"⏹ Stop":"\u{1F50A} Read aloud")+'</button></div>'+
       '<p class="body">'+esc(P.clue)+'</p></div>';
    if(S.wrong>=1) h+='<div class="hint"><span class="tag">\u{1F4A1} Hint</span><p>'+esc(P.hint)+'</p></div>';
    if(S.feedback) h+='<div class="wrongbox"><p>'+esc(S.feedback.msg)+'</p><span>+'+fmt(S.feedback.penalty)+'</span></div>';
    h+='<div class="guessrow"><input class="txt" id="guess" placeholder="Name the place…" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">'+
       '<button class="btn solid" data-act="guess">Guess</button></div>';
    h+='<p class="note">'+(S.wrong===0?"Wrong guess: +"+fmt(PENALTY_WRONG_1)+" and a hint.":"Last chance — a wrong guess adds +"+fmt(PENALTY_WRONG_2)+" and reveals the destination.")+'</p>';
  }

  if(S.phase==="travel"){
    var rv=R.revealed;
    h+='<div class="dest'+(rv?" revealed":"")+'"><div class="emoji">'+loc.emoji+'</div>'+
       '<span class="tag" style="color:'+(rv?"var(--warn)":"var(--success)")+'">'+(rv?"\u{1F4CD} Destination revealed":"✅ Correct! Head to")+'</span>'+
       '<h3>'+esc(loc.name)+'</h3>'+(loc.subtitle?'<p class="sub">'+esc(loc.subtitle)+'</p>':'')+
       (R.penalty?'<p class="pennote">+'+fmt(R.penalty)+' penalty at this stop</p>':'')+'</div>';
    h+='<button class="btn ghostbtn mb" data-act="directions">\u{1F5FA}️ Walking directions (Google Maps)</button>';
    h+='<div class="card"><p class="mini">\u{1F441} Stand within ~25 ft of the spot and check in to unlock the ghost story</p>';
    if(S.gpsStatus==="ok") h+='<button class="btn okbtn" disabled>✅ Location confirmed</button>';
    else h+='<button class="btn solid" data-act="checkin"'+(S.gpsStatus==="checking"?" disabled":"")+'>'+(S.gpsStatus==="checking"?"\u{1F4E1} Checking GPS…":"\u{1F4CD} We’re here — check in")+'</button>';
    if(S.gpsStatus==="fail"){h+='<p class="gpsmsg">'+esc(S.gpsMsg)+'</p>';if(S.gpsDist!==null)h+='<p class="gpsdist">Measured distance: about '+S.gpsDist+' m ('+Math.round(S.gpsDist*3.281)+' ft)</p>';}
    if(S.gpsTries>=MANUAL_AFTER_TRIES&&S.gpsStatus!=="ok"&&S.gpsStatus!=="checking") h+='<button class="btn warnbtn" style="margin-top:10px" data-act="manual">✋ GPS won’t cooperate — manual check-in (flagged on results)</button>';
    h+='</div>';
  }

  if(S.phase==="reward"){
    var t=S.tab;
    h+='<div class="arrived">✅ '+esc(loc.name)+' checked off'+(last?" — your clock has stopped!":"")+'</div>';
    h+='<div class="tabrow"><button class="tabb'+(t==="history"?" on":"")+'" data-act="tab" data-t="history">\u{1F4DC} History</button>'+
       '<button class="tabb'+(t==="ghost"?" on":"")+'" data-act="tab" data-t="ghost">\u{1F47B} Ghost Story</button></div>';
    h+='<div class="'+(t==="ghost"?"ghostcard":"histcard")+'"><span class="tag" style="margin-bottom:10px">'+loc.emoji+' '+esc(loc.name)+'</span>'+
       '<div class="player"><button class="pbtn" id="pbtn" data-act="play">▶</button><div class="pinfo"><div class="plab">Listen — '+(t==="ghost"?"Ghost Story":"History")+'</div>'+
       '<div class="pprog"><div id="pfill"></div></div></div><div class="ptime" id="ptime">--:--</div></div>'+
       '<p class="body">'+esc(t==="ghost"?loc.ghost:loc.history)+'</p></div>';
    h+='<button class="btn solid" data-act="next">'+(last?"\u{1F3C6} Complete the Hunt":"Next Clue →")+'</button>';
  }

  h+=journeyList()+'</div>';
  return h;
}
function stopDetail(r){
  if(r.revealed) return "revealed after 2 wrong guesses (+"+fmt(r.penalty)+")";
  if(r.wrong===1) return "solved with hint (+"+fmt(r.penalty)+")";
  return "solved on first guess";
}
function viewComplete(){
  var rows="",r=route();
  S.log.forEach(function(L,i){ if(!L) return; var loc=LOCATIONS[L.id];
    rows+='<div class="srow"><div class="sn">'+(i+1)+'</div><div class="sp"><b>'+loc.emoji+' '+esc(loc.name)+'</b><span>'+esc(stopDetail(L))+(L.manual?" · manual check-in":"")+'</span></div><div class="st">'+fmt(L.arrivedSec)+'</div></div>';});
  var when=S.finishedAt?new Date(S.finishedAt).toLocaleString():"";
  return '<div class="donebg"><div class="sumwrap">'+
    '<div style="font-size:60px">\u{1F3C6}</div>'+
    '<h2 class="head" style="font-size:34px;margin-bottom:2px">Hunt Complete!</h2>'+
    '<p class="tagline" style="margin-top:0">'+esc(S.teamName)+'</p>'+
    '<p class="route">Team '+S.teamNum+(when?" · "+esc(when):"")+'</p>'+
    '<div class="card"><p class="mini" style="margin-bottom:4px">Total time</p><p class="finaltime">'+fmt(S.finalSec)+'</p>'+
      '<div class="split"><div>Walking<b>'+fmt(S.finalSec-S.penaltySec)+'</b></div><div>Penalties<b style="color:'+(S.penaltySec?"var(--warn)":"var(--text)")+'">+'+fmt(S.penaltySec)+'</b></div></div></div>'+
    '<p class="seclab">Your journey</p><div class="card" style="padding:4px 16px">'+rows+'</div>'+
    '<button class="btn solid mt" data-act="png">\u{1F4E5} Download Journey Summary (PNG)</button>'+
    '<p class="fine">You’ve walked the haunted streets of Dublin and lived to tell the tale. Download your summary and send it to your instructor.</p>'+
    '<button class="btn ghostbtn" style="margin-top:16px;opacity:.55" data-act="reset">↺ Start a new hunt</button>'+
  '</div></div>';
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var html=S.screen==="splash"?viewSplash():S.screen==="setup"?viewSetup():S.screen==="complete"?viewComplete():viewHunt();
  document.getElementById("app").innerHTML=html;
  var tn=document.getElementById("tname");
  if(tn) tn.addEventListener("input",function(){S.teamName=this.value;var b=document.querySelector('[data-act="begin"]');if(b){if(S.teamNum&&S.teamName.trim())b.removeAttribute("disabled");else b.setAttribute("disabled","");}});
  syncPlayer();
}
function tick(){var c=document.getElementById("clock");if(c)c.textContent=fmt(elapsedSec());}
function startTicker(){if(ticker)clearInterval(ticker);ticker=setInterval(tick,1000);}

/* ============================================================
   GAME ACTIONS
   ============================================================ */
function submitGuess(){
  var box=document.getElementById("guess");if(!box)return;
  var val=box.value;if(!val.trim())return;
  S.resumed=false;var R=rec();
  if(matches(val,curId())){S.feedback=null;S.phase="travel";stopAudio();save();render();window.scrollTo(0,0);return;}
  R.wrong++;S.wrong++;
  if(S.wrong===1){S.penaltySec+=PENALTY_WRONG_1;R.penalty+=PENALTY_WRONG_1;R.hinted=true;
    S.feedback={msg:"“"+val.trim()+"” isn’t it. Here’s a hint.",penalty:PENALTY_WRONG_1};render();save();}
  else{S.penaltySec+=PENALTY_WRONG_2;R.penalty+=PENALTY_WRONG_2;R.revealed=true;S.feedback=null;S.phase="travel";stopAudio();save();render();window.scrollTo(0,0);}
}
function doCheckIn(){
  var loc=curLoc();S.resumed=false;S.gpsStatus="checking";S.gpsMsg="";S.gpsDist=null;render();
  if(!navigator.geolocation){S.gpsTries=MANUAL_AFTER_TRIES;S.gpsStatus="fail";S.gpsMsg="This device can’t provide GPS.";render();return;}
  navigator.geolocation.getCurrentPosition(function(pos){
    var d=haversine(pos.coords.latitude,pos.coords.longitude,loc.lat,loc.lng),acc=pos.coords.accuracy||0;
    S.gpsDist=Math.round(d);
    if(d<=CHECK_IN_RADIUS_M+Math.min(acc,GPS_SLACK_MAX_M)){arrive(false);}
    else{S.gpsTries++;S.gpsStatus="fail";S.gpsMsg="Not close enough yet — get within about 25 ft (8 m) of "+loc.name+" and try again."+(acc>20?" Your GPS signal is weak (±"+Math.round(acc)+" m); step into the open.":"");save();render();}
  },function(err){
    S.gpsTries++;S.gpsStatus="fail";
    S.gpsMsg=err.code===1?"Location access was denied. Allow location for this site in your browser settings and try again.":"Couldn’t get a GPS fix. Try again in a moment.";
    save();render();
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function arrive(manual){
  var R=rec(),last=S.stopIdx===route().length-1;
  R.arrivedSec=liveSec();R.manual=!!manual;
  if(last){S.finalSec=R.arrivedSec;if(ticker){clearInterval(ticker);ticker=null;}}
  S.gpsStatus="ok";render();save();
  setTimeout(function(){S.phase="reward";S.tab="history";S.gpsStatus="idle";S.gpsTries=0;S.gpsDist=null;stopAudio();save();render();window.scrollTo(0,0);},700);
}
function nextStop(){
  stopAudio();S.resumed=false;
  if(S.stopIdx>=route().length-1){S.finishedAt=Date.now();S.screen="complete";save();render();window.scrollTo(0,0);return;}
  S.stopIdx++;S.phase="clue";S.wrong=0;S.feedback=null;S.gpsStatus="idle";S.gpsMsg="";S.gpsDist=null;S.gpsTries=0;
  rec();save();render();window.scrollTo(0,0);
}

/* ============================================================
   PNG JOURNEY SUMMARY
   ============================================================ */
function downloadPNG(){
  var stops=S.log.filter(Boolean),W=1200,H=1010+stops.length*78,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
  var g=x.createRadialGradient(W/2,H*.25,80,W/2,H/2,H*.8);g.addColorStop(0,"#1a1a28");g.addColorStop(1,"#0a0a0f");x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle="#c9a84c";x.lineWidth=4;x.strokeRect(40,40,W-80,H-80);x.strokeStyle="rgba(201,168,76,0.3)";x.lineWidth=1;x.strokeRect(54,54,W-108,H-108);
  x.textAlign="center";
  x.font="72px serif";x.fillText("\u{1F47B}",W/2,150);
  x.fillStyle="#c9a84c";x.font="bold 62px Georgia,serif";x.fillText("Shadows of Dublin",W/2,240);
  x.fillStyle="#8a8677";x.font="italic 24px Georgia,serif";x.fillText("A Haunted Walking Scavenger Hunt — Journey Summary",W/2,282);
  x.fillStyle="#e8e4d9";x.font="bold 46px Georgia,serif";x.fillText(S.teamName,W/2,370);
  x.fillStyle="#8a8677";x.font="20px monospace";x.fillText("TEAM "+S.teamNum+"  ·  "+new Date(S.finishedAt||Date.now()).toLocaleDateString("en-IE",{year:"numeric",month:"long",day:"numeric"}),W/2,408);
  x.fillStyle="#8a8677";x.font="20px monospace";x.fillText("TOTAL TIME",W/2,480);
  x.fillStyle="#c9a84c";x.font="bold 92px monospace";x.fillText(fmt(S.finalSec),W/2,575);
  x.font="22px monospace";x.fillStyle="#e8e4d9";x.fillText("Walking "+fmt(S.finalSec-S.penaltySec)+"   +   Penalties "+fmt(S.penaltySec),W/2,622);
  var solved=stops.filter(function(r){return r.wrong===0;}).length;
  x.fillStyle="#8a8677";x.font="18px monospace";x.fillText(solved+" of "+stops.length+" clues solved on the first guess",W/2,656);
  x.strokeStyle="rgba(201,168,76,0.35)";x.beginPath();x.moveTo(120,700);x.lineTo(W-120,700);x.stroke();
  x.fillStyle="#8a8677";x.font="18px monospace";x.fillText("THE JOURNEY",W/2,745);
  var y=800;
  stops.forEach(function(r,i){var loc=LOCATIONS[r.id];
    x.textAlign="left";
    x.fillStyle=r.revealed?"#c9944c":r.wrong?"#c9a84c":"#4cc96a";x.beginPath();x.arc(140,y-8,20,0,Math.PI*2);x.fill();
    x.fillStyle="#000";x.font="bold 18px monospace";x.textAlign="center";x.fillText(String(i+1),140,y-2);
    x.textAlign="left";x.fillStyle="#e8e4d9";x.font="26px Georgia,serif";x.fillText(loc.emoji+"  "+loc.name,185,y);
    x.fillStyle="#8a8677";x.font="17px monospace";x.fillText(stopDetail(r)+(r.manual?" · manual check-in":""),185,y+28);
    x.textAlign="right";x.fillStyle="#c9a84c";x.font="22px monospace";x.fillText(fmt(r.arrivedSec),W-130,y);
    y+=78;});
  x.textAlign="center";x.fillStyle="#8a8677";x.font="italic 18px Georgia,serif";x.fillText("The spirits thank you for visiting… and hope you’ll return.",W/2,H-80);
  var name="shadows-of-dublin-team"+S.teamNum+"-"+S.teamName.replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".png";
  c.toBlob(function(b){var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},4000);},"image/png");
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="to-setup"){S.screen="setup";render();}
  else if(act==="to-splash"){S.screen="splash";render();}
  else if(act==="team"){S.teamNum=parseInt(el.getAttribute("data-n"),10);render();}
  else if(act==="begin"){
    if(!S.teamNum||!S.teamName.trim())return;
    S.teamName=S.teamName.trim();S.screen="hunt";S.stopIdx=0;S.phase="clue";S.wrong=0;S.feedback=null;
    S.startMs=Date.now();S.penaltySec=0;S.finalSec=null;S.finishedAt=null;S.log=[];S.resumed=false;S.gpsTries=0;
    rec();startTicker();save();render();
  }
  else if(act==="guess") submitGuess();
  else if(act==="speak"){if(speaking){stopAudio();}else speakText(curPuz().clue);render();}
  else if(act==="directions"){var L=curLoc();window.open("https://www.google.com/maps/dir/?api=1&destination="+L.lat+","+L.lng+"&travelmode=walking","_blank");}
  else if(act==="checkin") doCheckIn();
  else if(act==="manual") arrive(true);
  else if(act==="tab"){S.tab=el.getAttribute("data-t");stopAudio();render();}
  else if(act==="play") toggleMp3(curId(),S.tab);
  else if(act==="next") nextStop();
  else if(act==="png") downloadPNG();
  else if(act==="reset"){if(window.confirm("Start over? This erases your team’s progress and resets the clock.")){wipe();stopAudio();window.location.href=window.location.pathname;}}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target&&ev.target.id==="guess"){ev.preventDefault();submitGuess();}});

/* ============================================================
   BOOT
   ============================================================ */
if(window.location.search.indexOf("reset")!==-1) wipe();
if(load()){S.resumed=true;if(S.screen==="hunt"&&S.finalSec===null)startTicker();}
render();
window.__SOD={S:S,matches:matches,route:route};
})();
</script>
</body>
</html>
